<rect x="281.7" y="999.8" width="415" height="80" rx="8" fill="#ffffff" stroke="#0b6e63" stroke-width="1.8" opacity="0.96"/>
<text x="295.7" y="1031.8" font-size="21" font-weight="600" fill="#085248">Leaving Point: 2P<tspan baseline-shift="sub" font-size="15">e</tspan>(δ<tspan baseline-shift="sub" font-size="15">m</tspan>)δ<tspan baseline-shift="super" font-size="15">2</tspan> = HMSE</text>
<text x="295.7" y="1063.8" font-size="19" fill="#2c353d">σ<tspan baseline-shift="sub" font-size="15">leave</tspan> = 0.204 σ<tspan baseline-shift="sub" font-size="15">jump</tspan> (0.0170 rad ≈ 1.0°)</text>
