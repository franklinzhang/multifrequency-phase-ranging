<text x="466.1" y="428.9" font-size="19" fill="#2c353d">• Coherent MLE: −22.8 dB (hard rounding)</text>
<text x="466.1" y="458.9" font-size="19" fill="#2c353d">• Bayes E[d|φ]: −24.2 dB (= MMSE) | ZZB: −27.6 dB</text>
