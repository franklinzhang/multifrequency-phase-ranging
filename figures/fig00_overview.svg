<text x="746.9" y="930.1" font-size="22" font-weight="600" fill="#1c232b">Carrier Line: HMSE = c²σ² / (4π²F) = CRB<tspan baseline-shift="sub" font-size="16">local</tspan></text>
<text x="746.9" y="962.1" font-size="19" fill="#4a5560">Origin-anchored fit (lever arm √F); local Fisher info never jumps</text>
