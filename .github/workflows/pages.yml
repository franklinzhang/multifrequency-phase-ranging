name: Deploy reading site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the built site to the gh-pages branch.
# Enable Pages: Settings → Pages → Deploy from a branch → gh-pages / (root).
# (Actions "deploy-pages" is omitted until the owner enables Pages; it 404s otherwise.)

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and build
        run: |
          pip install "markdown>=3.5,<4" "pymdown-extensions>=10.0,<11"
          python3 site/build_site.py
          touch site/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
