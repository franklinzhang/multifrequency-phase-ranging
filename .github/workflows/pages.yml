name: Deploy reading site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the public bilingual reading edition to gh-pages.
# Live URL: https://franklinzhang.github.io/multifrequency-phase-ranging/

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and build
        run: |
          pip install "markdown>=3.5,<4" "pymdown-extensions>=10.0,<11"
          python3 site/build_site.py
          mkdir -p /tmp/pages-out
          cp -a site/index.html site/zh.html site/en.html site/explore.html \
                site/assets site/figures site/data /tmp/pages-out/
          touch /tmp/pages-out/.nojekyll
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/pages-out
          force_orphan: true
